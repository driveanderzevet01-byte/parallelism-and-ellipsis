<title>Parallelism, Ellipsis &amp; Summative Guide</title>
<style>
:root{--bg:#0e1117;--card:#161b24;--card2:#1c2230;--text:#e7eaf0;--muted:#98a2b3;--line:#283042;--good:#4fd193;--bad:#ff7a7a;--c1:#6cb6ff;--c2:#7ee0a6;--c3:#f2c36b;--c4:#e48fd0;--c5:#ff9b7a;--c6:#a99bff;--ac:#6cb6ff;color-scheme:dark}

html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 90px max(16px,env(safe-area-inset-right))}

p{margin:.6em 0}
a{color:var(--c1)}
h1{font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.15;margin:.2em 0 .3em}
h2{font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.25;margin:0 0 .4em}

.top{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

#bar{height:3px;width:0;background:var(--c1)}

.badge{display:inline-block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ac);border-radius:999px;padding:2px 12px;margin-bottom:8px}

.example{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}

.fstat{position:sticky;bottom:10px;z-index:10;margin:14px 0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-size:.92rem}

footer a{color:var(--muted)}
/* signature steps + mock UI */
.steps{counter-reset:st;list-style:none;padding:0;margin:0}

.step h4:before{counter-increment:st;content:counter(st);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#0e1117;display:grid;place-items:center;font-size:.9rem}
.step p{margin:.3em 0;text-align:left}

.ui .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #eceff1;background:#f8fafd}
.ui .srch{flex:1;background:#e9eef6;border-radius:20px;padding:6px 14px;color:#5f6368;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden}
.ui .ico{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;flex:none}
.ui .ico svg{width:22px;height:22px;fill:#444746}
.ui .logo{font-weight:700;color:#d93025;flex:none}
.ui .jiu{flex:none;border:1px solid #dadce0;border-radius:16px;padding:2px 8px;font-size:11px;font-weight:700;color:#1a237e}
.ui .pad{padding:12px 14px}
.ui.pad{padding:12px 14px}

.ui .panel{margin:10px 12px 14px auto;width:min(260px,92%);border:1px solid #dadce0;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);background:#fff}
.ui .ph{font-size:15px;margin-bottom:8px}
.ui .uibtn{display:block;width:100%;text-align:center!important;border:1px solid #747775;border-radius:18px;padding:6px 10px;color:#0b57d0;font-weight:600;background:#fff}
.ui .muted{color:#5f6368;font-size:12px}
.ui .tabs{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 14px 0;border-bottom:1px solid #e0e0e0;font-size:13px;color:#444746}
.ui .tabs span{padding:6px 2px}
.ui .tabs .on{color:#0b57d0;border-bottom:3px solid #0b57d0;font-weight:600}
.ui .title{font-size:20px;padding:10px 14px 4px;color:#1f1f1f}

.ui .tool{border-top:1px solid #dadce0;margin-top:8px;padding-top:4px;color:#5f6368;font-size:12px}
.ui .cnew{display:inline-block;margin-top:8px;border:1px solid #dadce0;border-radius:6px;padding:4px 18px;color:#0b57d0}
.ui .dlg{margin:22px auto;width:min(300px,90%);background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:16px}
.ui .inp{border:2px solid #0b57d0;border-radius:4px;padding:6px 8px;margin:8px 0 14px}
.ui .acts{display:flex;justify-content:flex-end;gap:16px;color:#0b57d0;font-weight:600}
.ui .shade{background:#9aa0a6;padding:2px 0}
.ui .dd{display:inline-flex;justify-content:space-between;gap:10px;min-width:160px;border:1px solid #747775;border-radius:4px;padding:3px 8px;font-size:13px}
.ui .caps{font-size:11px;letter-spacing:.04em;color:#444746;font-weight:700;margin:6px 0 2px}

.ui .chg{background:#fff3b0;border-radius:3px}
.hl{outline:3px solid #ff3b30;outline-offset:3px;border-radius:8px;animation:pulse 1.6s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){.hl{animation:none}}
.pin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ff3b30;color:#fff;font:700 11px Arial;margin-left:6px;vertical-align:middle}
.shot{margin:12px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.shotcap{font-size:.86rem;color:var(--muted);margin-top:6px;text-align:left}
.copybox{background:#fff;color:#202124;border-radius:12px;padding:14px 16px;margin:10px 0;border:1px solid #dadce0}
.copyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copied{color:var(--good);font-size:.9rem}
@media(max-width:560px){body{font-size:16px}.hero{padding-top:28px}.quiz{padding:12px}.ui .row{grid-template-columns:1fr}.ui .sbox{grid-template-columns:90px 1fr}}
</style>
<style>
.fix{display:grid;gap:4px;margin:10px 0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.fix p{margin:0;text-align:left}
.fix .x{color:var(--muted)}.fix .x:before{content:"✗ ";color:var(--bad);font-weight:700}
.fix .v:before{content:"✓ ";color:var(--good);font-weight:700}
.fix .why{font-size:.9rem;color:var(--muted)}
em.w{font-style:normal;color:var(--bad);font-weight:700}
em.r{font-style:normal;color:var(--good);font-weight:700}
em.o{font-style:normal;color:var(--muted);text-decoration:line-through}
.part2{margin:40px 0 0;padding:22px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(169,155,255,.18),rgba(108,182,255,.12));border:1px solid var(--line)}
.part2 h2{margin:0}
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:16px 0}
.task>h3{margin-top:0}
.instr{border-left:4px solid var(--ac);background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0;text-align:left}
.instr ol{margin:.3em 0;padding-left:1.4em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.meta span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.meta span b{color:var(--text)}
.timeline{display:grid;gap:12px;margin:12px 0}
@media(min-width:860px){.timeline{grid-template-columns:repeat(3,1fr)}}
.timeline>div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px}

.timeline a{font-size:.88rem}
.mapt td:first-child{white-space:nowrap;font-weight:700}
.exbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.exbox p{margin:.35em 0;text-align:left}
.exbox .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);font-weight:700}
.n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--ac);color:#0e1117;font-size:.7rem;font-weight:700;margin-right:4px;vertical-align:1px}
.hl1{background:rgba(242,195,107,.18);border-radius:3px}
.note{font-size:.9rem;color:var(--muted);text-align:left}
</style>

<script>
const QUIZ=[
[ /* 1 Parallelism */
{t:"Theory",q:"What does parallelism mean?",c:"Using the same grammatical pattern in a list or pair",w:["Using long sentences","Repeating every word twice","Writing two sentences that have exactly the same meaning and the same length"],e:"Parallelism = the items in a list, comparison or pair have the same form: all nouns, all adjectives, all verbs, and so on."},
{t:"Practice",q:"Choose the correct sentence.",c:"I can sing, cook, and bake.",w:["I can sing, cook, and baking.","I can sing, cooking, and bake.","I can singing, cooking, and to bake a cake."],e:"After 'can', all three verbs are base forms: sing, cook, bake."},
{t:"Practice",q:"He is tall, smart, and ___.",c:"elegant",w:["elegantly","elegance","a person with a lot of elegance"],e:"The list has adjectives (tall, smart), so the third item must be an adjective: elegant."},
{t:"Practice",q:"Don't judge someone's personality, appearance, and ___.",c:"intelligence",w:["intelligent","intelligently","how intelligent the person seems to be"],e:"personality and appearance are nouns, so the third item is the noun intelligence."},
{t:"Practice",q:"You know how to teach, what to learn, and ___.",c:"when to study",w:["the time to study","studying","the best time for you to do your studying"],e:"The list uses question word + to-infinitive: how to teach, what to learn, when to study."}
],
[ /* 2 Ellipsis */
{t:"Theory",q:"What is ellipsis?",c:"Leaving out repeated words when the meaning is clear",w:["Adding extra words","Using three dots in every sentence","Repeating the subject in each clause so the reader does not get confused"],e:"Ellipsis = leaving out words that are repeated, usually in sentences joined with and, or, but."},
{t:"Practice",q:"She can play the guitar. He can play the guitar. →",c:"She can play the guitar, and he can too.",w:["She can play the guitar, and he too.","She can play the guitar, and he can play too.","She can play the guitar, and he is able to do the same thing as well."],e:"Keep the modal (can) and leave out the repeated verb phrase: 'and he can too'."},
{t:"Practice",q:"I like mangoes. I like papayas. →",c:"I like mangoes and papayas.",w:["I like mangoes and like.","I mangoes and papayas like.","I like mangoes, and I also like papayas, and I like them."],e:"The subject and verb are the same, so say them once: I like mangoes and papayas."},
{t:"Practice",q:"I am cooking. I am singing. →",c:"I am cooking and singing.",w:["I cooking and singing.","I am cooking and am.","I am cooking, and I am singing, and I am."],e:"Same subject + same auxiliary (am): say 'I am' once, then join the -ing verbs."},
{t:"Theory",q:"After which words can you often leave out the rest of the verb phrase?",c:"Modals and auxiliaries (can, has, is)",w:["Nouns","Adjectives","Prepositions like in, on, at, and under"],e:"You can stop after a modal or auxiliary: 'He has finished, and she has too.' 'She is working, and he is too.'"}
],
[ /* 3 In your writing */
{t:"Practice",q:"Which sentence is parallel?",c:"Both countries will train farmers, share data, and build tools.",w:["Both countries will train farmers, sharing data, and build tools.","Both countries will train farmers, share data, and the building of tools.","Both countries will training farmers, to share data, and building some tools."],e:"After 'will', all verbs are base forms: train, share, build."},
{t:"Practice",q:"Our country needs funding, experts, and ___.",c:"coordination",w:["coordinate","to coordinate","we coordinate with local stakeholders"],e:"funding and experts are nouns, so use the noun coordination."},
{t:"Practice",q:"Which sentence uses ellipsis correctly?",c:"We have visited the farms and met the farmers.",w:["We have visited the farms and have.","We visited the farms and have met.","We have visited the farms, and we have met the farmers, and we have."],e:"Same subject + same auxiliary (have): say 'we have' once."},
{t:"Practice",q:"Indonesia can provide training. Colombia can provide training. →",c:"Indonesia can provide training, and Colombia can too.",w:["Indonesia can provide training, and Colombia too.","Indonesia and Colombia can training.","Indonesia can provide training, and Colombia can provide it, too, also."],e:"Different subjects: keep the modal for the second subject ('Colombia can too')."},
{t:"Practice",q:"Which sentence is parallel? (paired idea)",c:"The project will not only reduce waste but also create jobs.",w:["The project will not only reduce waste but also it creates jobs.","The project will not only reduce waste but also creating jobs.","The project not only will reduce waste but also it will be creating jobs."],e:"After 'not only' and 'but also', use the same form: reduce … create."}
],
[ /* 4 Summative overview */
{t:"Theory",q:"How many parts does the summative have?",c:"Four",w:["Three","Five","Eight"],e:"Global Problem, Supporting Evidence, Email Exchange, Follow-up Actions."},
{t:"Practice",q:"In class, you wrote what your problem is and how it links to SDG 17. Which summative part does this help most?",c:"Part 1: Global Problem",w:["Part 3: Email Exchange","Part 4: Follow-up Actions","Part 2: Supporting Evidence"],e:"Your 'offer' (the problem and its SDG 17 link) is the base of Part 1."},
{t:"Practice",q:"You made a graph about your problem and described it in class. Which part uses this?",c:"Part 2: Supporting Evidence",w:["Part 1: Global Problem","Part 3: Email Exchange","Part 4: Follow-up Actions"],e:"Part 2 asks you to explain the graph: main idea, source, trend, comparison, conclusion."},
{t:"Practice",q:"'What solution do you offer, and which collaborative efforts?' Your answer now goes in…",c:"Part 3: Email Exchange",w:["Part 2: Supporting Evidence","Part 1: Global Problem","Part 4: Follow-up Actions"],e:"The email body explains the solution, how it solves the problem, and at least 3 collaborative efforts."},
{t:"Theory",q:"Which material helps you write the 3 citations in the email?",c:"Reported speech and citation",w:["Email signature only","Describing figures","Parallelism and ellipsis"],e:"The email needs at least 3 citations from trusted sources, so use the reported speech and citation materials."}
],
[ /* 4 Tasks */

<h1>Parallelism &amp; Ellipsis</h1>
<p>Good writers make their sentences <b>balanced</b> and <b>short</b>. Parallelism keeps the items in a list in the same form. Ellipsis leaves out words that repeat. Both make your writing clearer and more professional.</p>

/* 1 Parallelism */
html+=`<section id="s1" style="--ac:var(--c1)"><span class="badge">Part 1 · Lesson 1</span><h2>Parallelism</h2>
<p><b>Parallelism</b> means using the <b>same grammatical pattern or structure</b> in a list, a comparison, or paired ideas. When items are joined with <b>and</b> or <b>or</b>, they should have the same form.</p>
<h3>What can be parallel?</h3>
<div class="tw"><table><thead><tr><th>Form</th><th>Example</th></tr></thead><tbody>
<tr><td>Verb (base form)</td><td>I can sing, cook, and bake.</td></tr>
<tr><td>Gerund (-ing)</td><td>She enjoys reading, writing, and traveling.</td></tr>
<tr><td>To-infinitive</td><td>We want to reduce waste, to save water, and to protect forests.</td></tr>
<tr><td>Noun</td><td>Don't judge someone's personality, appearance, or intelligence.</td></tr>
<tr><td>Adjective</td><td>He is tall, smart, and elegant.</td></tr>
<tr><td>Question word (+ to)</td><td>You know how to teach, what to learn, and when to study.</td></tr></tbody></table></div>
<h3>Examples from the slides</h3>
${fix("I can sing, cook, and <em class='w'>baking</em>.","I can sing, cook, and <em class='r'>bake</em>.","sing, cook → verbs, so bake (not baking).")}
${fix("He is tall, smart, and <em class='w'>elegantly</em>.","He is tall, smart, and <em class='r'>elegant</em>.","tall, smart → adjectives, so elegant (not the adverb elegantly).")}
${fix("Don't judge someone's personality, appearance, and <em class='w'>intelligent</em>.","Don't judge someone's personality, appearance, and <em class='r'>intelligence</em>.","personality, appearance → nouns, so intelligence (not the adjective intelligent).")}
${fix("You know how to teach, what to learn, and <em class='w'>the time to study</em>.","You know how to teach, what to learn, and <em class='r'>when to study</em>.","how to …, what to … → question word + to, so when to study.")}
<h3>Comparisons and pairs</h3>
<p>Parallelism is also needed in comparisons (<i>than, as … as</i>) and in pairs (<i>both … and, either … or, not only … but also</i>).</p>
${fix("Training farmers is better than <em class='w'>to give</em> money.","Training farmers is better than <em class='r'>giving</em> money.","Training (-ing) … giving (-ing).")}
${fix("The project will not only reduce waste but also <em class='w'>it creates</em> jobs.","The project will not only reduce waste but also <em class='r'>create</em> jobs.","not only reduce … but also create.")}
<h3>How to check</h3>
<ol class="tips"><li>Find the joining word: <b>and, or, than, both … and</b>.</li><li>Look at the first item. What form is it (verb, -ing, noun, adjective …)?</li><li>Make every other item the same form.</li></ol>
<div class="quiz" id="q1"></div></section>`;

/* 2 Ellipsis */
html+=`<section id="s2" style="--ac:var(--c2)"><span class="badge">Part 1 · Lesson 2</span><h2>Ellipsis</h2>
<p><b>Ellipsis</b> means <b>leaving out repeated words</b> in sentences joined with <b>and, or, but</b>, because the meaning is clear. For example, you can leave out the words after <b>modals</b> (can, will, should …) or <b>auxiliary verbs</b>: has/have/had in the perfect tense, or <i>to be</i> in the progressive tense.</p>
<h3>Examples from the slides</h3>
<div class="exbox"><p>She <em class="o">can play the guitar</em>. He can play the guitar.</p><p>→ <b>She can play the guitar, and he can too.</b></p></div>
<div class="exbox"><p>I like mangoes. <em class="o">I like</em> papayas.</p><p>→ <b>I like mangoes and papayas.</b></p></div>
<div class="exbox"><p>I am cooking. <em class="o">I am</em> singing.</p><p>→ <b>I am cooking and singing.</b></p></div>
<h3>Three common patterns</h3>
<div class="tw"><table><thead><tr><th>Pattern</th><th>Full</th><th>With ellipsis</th></tr></thead><tbody>
<tr><td>Same subject: say the subject (+ auxiliary) once</td><td>We have visited the farms, and we have met the farmers.</td><td>We have visited the farms and met the farmers.</td></tr>
<tr><td>Different subject: stop after the modal/auxiliary + <i>too</i></td><td>Indonesia can provide training, and Colombia can provide training.</td><td>Indonesia can provide training, and Colombia can too.</td></tr>
<tr><td>Contrast with <i>but</i>: stop after the negative auxiliary</td><td>Indonesia will send experts, but Colombia will not send experts.</td><td>Indonesia will send experts, but Colombia won't.</td></tr></tbody></table></div>
<h3>Be careful</h3>
${fix("She can play the guitar, and he <em class='w'>too</em>.","She can play the guitar, and he <em class='r'>can</em> too.","With a different subject, keep the modal or auxiliary.")}
${fix("I am cooking and he <em class='w'>singing</em>.","I am cooking, and he <em class='r'>is singing</em>.","Different subject (he) and different auxiliary (is), so you cannot leave it out.")}
<p class="note">Rule of thumb: leave words out only when the reader can easily put them back.</p>
<div class="quiz" id="q2"></div></section>`;

/* 3 In your writing */
html+=`<section id="s3" style="--ac:var(--c3)"><span class="badge">Part 1 · Lesson 3</span><h2>Parallelism &amp; Ellipsis in Your Writing</h2>
<p>In Global Relations texts, you often list problems, solutions, actions and needs. This is where parallelism and ellipsis help most. Often you use them together: you say the shared words once (ellipsis) and keep the list items in the same form (parallelism).</p>
<h3>Before and after</h3>
<div class="exbox"><span class="lab">Before: repetitive and not parallel</span><p>Our country will provide training for farmers. Our country will prepare benchmarking visits. Our country will also <em class="w">producing</em> better fertilizers. The partner country will apply the practices, and the partner country will give feedback.</p></div>
<div class="exbox"><span class="lab">After</span><p>Our country will <span class="hl1">provide</span> training for farmers, <span class="hl1">prepare</span> benchmarking visits, and <span class="hl1">produce</span> better fertilizers, while the partner country will <span class="hl1">apply</span> the practices and <span class="hl1">give</span> feedback.</p><p class="note">'Our country will' is said once (ellipsis), and all verbs after <i>will</i> are base forms (parallelism).</p></div>
<h3>Useful patterns for the summative</h3>
<div class="tw"><table><thead><tr><th>Use</th><th>Example</th></tr></thead><tbody>
<tr><td>Listing effects of a problem</td><td>Many regions face deforestation, soil degradation, and loss of biodiversity. <span class="note">(nouns)</span></td></tr>
<tr><td>Listing solutions</td><td>Both countries agreed to train farmers, share knowledge, and trade better tools. <span class="note">(to + verbs)</span></td></tr>
<tr><td>Listing needs</td><td>Our country requires proper funding, technical experts, and consistent coordination. <span class="note">(adjective + noun)</span></td></tr>
<tr><td>Describing trade</td><td>… fair, responsible, and environmentally safe trade practices. <span class="note">(adjectives)</span></td></tr>
<tr><td>Sharing the work</td><td>My country will provide training, and the partner country will too.</td></tr></tbody></table></div>
<div class="quiz" id="q3"></div></section>`;

{n:2,title:"Supporting Evidence",min:"at least 5 sentences",ins:"Explain the graph/chart of the supporting data for your problem report in a PARAGRAPH (at least 5 sentences).",pts:["What the graph/chart is about (main idea)","Where/who you cited it from (in-text citation)","What the trend is like","How the main features compare to each other (comparison)","How you generalize the data from the graph/chart and relate it to the chosen problem (conclusion)"],
tips:["Main idea: <i>The chart shows …</i> (no numbers yet)","In-text citation: <i>According to [source] (year), …</i> or <i>[Source] (year) reported that …</i>","Trend: <i>The overall trend suggests … / Overall, … increased / decreased.</i>","Comparison: <i>more … than, while, whereas, twice as … as</i>","Conclusion: <i>Overall, the chart highlights that …, supporting the problem of …</i>"],
ex:`<p><span class="n">a</span>The chart shows how major coffee-roasting companies balance sustainable and conventional coffee sourcing. <span class="n">b</span>According to <i>State of Sustainable Initiatives</i> (2021), companies vary widely in both consumption volume and sustainability commitments. <span class="n">c</span>The overall trend suggests gradual improvement, with firms like Nestlé and Jacobs Douwe Egberts consuming the most coffee while moving toward higher sustainable percentages. <span class="n">d</span>Some companies, such as Starbucks and Tchibo, aim for 100% sustainable sourcing, while others show <span class="hl1">limited data (45%) or weaker commitments (30%)</span>. Larger firms generally report clearer targets than smaller ones. <span class="n">e</span>Overall, the chart highlights that sustainable sourcing is growing but still insufficient, supporting the global problem of environmentally harmful coffee production.</p>`,cnt:6},
{n:3,title:"Email Exchange",min:"email format",ins:"Create an effective and persuasive email to invite your partner country to discuss the collaborative efforts in solving the chosen global problem. Include these aspects:",table:true,
tips:["Follow the 5-part structure: subject, greetings &amp; introduction, body, closing remark, closing greeting &amp; sender information.","Problem: report at least 3 trusted sources with in-text citations, e.g. <i>… suggested that … (WTO, 2025)</i>. After a past saying verb, move the verb back.","Solution: <i>Our country would like to propose …</i> + how it helps: <i>This solution helps … by …</i>","Collaborative efforts (at least 3) in a parallel list: <i>training programs, benchmarking programs, and joint production of …</i>","Why they matter: <i>Collaborative efforts are important because they allow both countries to …</i>","See more on the <a href='https://driveanderzevet01-byte.github.io/effective-and-persuasive-email/' target='_blank' rel='noopener'>Persuasive email</a> page."],
ex:`<p><b>Subject:</b> Invitation to Coordination Meeting on Sustainable Coffee Trade Collaboration</p><p>Dear Mr. Ana from ABC Nation,</p><p>I hope you are doing well. My name is Nana, serving as the representative of BCA Nation's Ministry of Trade for the SDG 17 Collaboration Program. We would like to invite your delegation to a coordination meeting to discuss our joint efforts in promoting sustainable coffee production and trade.</p><p><span class="n">1</span><span class="hl1">Recent international reviews have suggested that global coffee demand is rising faster than sustainable supply (WTO, 2025)</span>, while <span class="hl1">a regional economic brief noted that small producers struggled to access tools that improved crop quality (Jie et al., 2023)</span>. In addition, <span class="hl1">one sustainability assessment highlighted that knowledge-sharing between partner countries improved long-term productivity (Rie &amp; Suzuki, 2024)</span>. These points show why our collaboration is urgent.</p><p><span class="n">2</span>To solve this issue both countries face, our country would like to propose a joint program to <span class="hl1">empower</span> local producers and <span class="hl1">improve</span> the quality of cultivation tools and materials. <span class="n">3</span>This solution helps reduce environmental harm by ensuring producers rely on sustainable methods rather than intensive, damaging practices. <span class="n">4</span>This program highlights these collaborative efforts: <span class="hl1">training programs for local producers, benchmarking programs for experts to share knowledge, and joint production of higher-quality tools and fertilizers</span>.</p><p><span class="n">5</span>Collaborative efforts are important because they allow both countries to combine their <span class="hl1">expertise, resources, and technology</span> to address shared challenges more effectively. Through <span class="hl1">training, knowledge exchange, and joint production</span>, both countries can <span class="hl1">improve</span> local producers' skills, <span class="hl1">adopt</span> better practices, and <span class="hl1">develop</span> higher-quality agricultural tools and fertilizers. This cooperation can also strengthen long-term relations and create mutual benefits for both countries.</p><p>We look forward to your confirmation.</p><p>Best regards,<br>Nana<br>BCA Nation's Ministry of Trade</p><p class="note">Numbers: <b>1</b> problem with 3 citations · <b>2</b> solution · <b>3</b> how it solves the problem · <b>4</b> at least 3 collaborative efforts · <b>5</b> why they are important. Highlighted: citations (reported speech) and parallel lists.</p>`},
{n:4,title:"Follow-up Actions",min:"at least 5 sentences",ins:"Explain the actions that the country takes to act upon/follow up on the collaborative efforts in a PARAGRAPH (at least 5 sentences).",pts:["The follow-up actions your country made so the collaborative efforts can be achieved (at least 3)","Why those actions can support the collaborative efforts (explain each of those 3)","What is needed so your country can execute those actions (at least 3)"],
tips:["<i>To support the agreed collaborative efforts, our country is …</i>","Use the present progressive for actions already started: <i>We are developing / preparing / working …</i>","Give a reason for EACH action: <i>…, which directly helps …</i> / <i>so (that) …</i> / <i>to support …</i>","<i>To execute these actions, our country requires …, …, and …</i> (at least 3 parallel nouns)"],
ex:`<p>To support the agreed collaborative efforts, our country is taking several concrete follow-up actions. <span class="n">a</span>We are developing targeted training programs to strengthen the skills of local coffee producers, <span class="n">b</span>which directly helps improve sustainable production. <span class="n">a</span>We are also preparing a benchmarking schedule with the partner country <span class="n">b</span>so both sides can compare practices and enhance productivity together. <span class="n">a</span>In addition, we are working to produce higher-quality tools and fertilizers that can be exported <span class="n">b</span>to support their cultivation needs. <span class="n">c</span>To execute these actions effectively, our country requires <span class="hl1">proper funding, technical experts, and consistent coordination</span> with local stakeholders.</p>`,cnt:5}];

html+=`<section id="s6" style="--ac:var(--c6)"><span class="badge">Part 2 · Section 6</span><h2>Language Toolkit for the Summative</h2>
<h3>Reported speech</h3>
<p>With a <b>present</b> saying verb (<i>says, states, explains</i>), keep the tense. With a <b>past</b> saying verb (<i>said, reported, noted</i>), move the verb one step back. Change the pronouns, and do not use quotation marks.</p>
<div class="tw"><table><thead><tr><th>Direct speech</th><th>Indirect (past saying verb)</th></tr></thead><tbody>
<tr><td>He said, "I <b>have</b> photos from Paris."</td><td>He said that he <b>had</b> photos from Paris.</td></tr>
<tr><td>He said, "I <b>am visiting</b> Korea."</td><td>He said that he <b>was visiting</b> Korea.</td></tr>
<tr><td>He said, "I <b>have visited</b> Singapore."</td><td>He said that he <b>had visited</b> Singapore.</td></tr>
<tr><td>He said, "I <b>kept</b> photos from Paris."</td><td>He said that he <b>had kept</b> photos from Paris.</td></tr>
<tr><td>He said, "I <b>was visiting</b> Korea."</td><td>He said that he <b>had been visiting</b> Korea.</td></tr>
<tr><td>He said, "I <b>had visited</b> Singapore."</td><td>He said that he <b>had visited</b> Singapore. (no change)</td></tr></tbody></table></div>
<p class="note">Present saying verb: Mia says, "I love ice cream." → Mia says that she loves ice cream.</p>
<h3>Citation (APA)</h3>
<div class="tw"><table><thead><tr><th>Authors</th><th>In-text citation</th><th>In a sentence</th></tr></thead><tbody>
<tr><td>No author</td><td>(<i>Title of Page</i>, 2023)</td><td>According to <i>Title of Page</i> (2023), …</td></tr>
<tr><td>1 author</td><td>(Smith, 2023)</td><td>Smith (2023) reported that …</td></tr>
<tr><td>2 authors</td><td>(Smith &amp; Jones, 2023)</td><td>Smith and Jones (2023) stated that …</td></tr>
<tr><td>3+ authors</td><td>(Smith et al., 2023)</td><td>Smith et al. (2023) noted that …</td></tr></tbody></table></div>
<h3>Describing a graph (for Task 2)</h3>
<ol class="tips"><li><b>Main idea</b>: The chart shows …</li><li><b>Trend</b>: Overall, … increased / decreased / stayed stable.</li><li><b>Comparison</b>: … is higher than … / twice as … as …</li><li><b>Specific data</b>: … reached / accounts for 45%.</li><li><b>Conclusion</b>: In summary, … (no new data)</li></ol>
<h3>The 8 SDG 17 areas</h3>
<ul class="chips"><li>Capacity Development</li><li>Finance</li><li>Financial Inclusion</li><li>Trade</li><li>Multi-Stakeholder Partnerships</li><li>National Strategies &amp; SDG Integration</li><li>Science</li><li>Technology</li></ul>
<p class="note">Your country has one assigned area. In Task 1, explain why your problem is related to that area.</p>
<div class="quiz" id="q6"></div></section>`;
